name: StopTB UAT Signed Build
run-name: STOP TB UAT Signed - ${{ inputs.versionName }} (${{ inputs.versionCode }}) [${{ inputs.branch }}]

on:
  workflow_dispatch:
    inputs:
      description:
        description: 'Release notes / description for this build'
        required: false
        type: string
        default: ''
      branch:
        description: 'Git branch to build from (example: release-2.1). Matching is case-insensitive.'
        required: true
        type: string
        default: 'release-2.1'
      versionName:
        description: 'Build version (example: 1.0.3)'
        required: true
        type: string
        default: '1.0.3'
      versionCode:
        description: 'Build number (example: 4)'
        required: true
        type: string
        default: '4'

permissions:
  contents: read

concurrency:
  group: distribute-uat-release-${{ inputs.branch }}
  cancel-in-progress: true

jobs:
  build-and-distribute:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check required secrets
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          FIREBASE_APP_ID_UAT: ${{ secrets.FIREBASE_APP_ID_UAT }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SERVICES_JSON_UAT: ${{ secrets.GOOGLE_SERVICES_JSON_UAT }}
          GOOGLE_SERVICES_JSON_PROD: ${{ secrets.GOOGLE_SERVICES_JSON_PROD }}
        run: |
          missing=0
          for name in RELEASE_KEYSTORE_BASE64 RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD FIREBASE_APP_ID_UAT FIREBASE_SERVICE_ACCOUNT_JSON GOOGLE_SERVICES_JSON_UAT GOOGLE_SERVICES_JSON_PROD; do
            if [ -z "${!name}" ]; then
              echo "Missing required secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Add the missing repository secrets, then re-run this workflow."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Checkout requested branch
        run: |
          set -euo pipefail
          REQUESTED="${{ inputs.branch }}"
          MATCH="$(git ls-remote --heads origin | awk '{print $2}' | sed 's|^refs/heads/||' | grep -ixF -- "$REQUESTED" | head -n 1 || true)"
          if [ -z "$MATCH" ]; then
            echo "Branch not found: '$REQUESTED'"
            echo "Available branches:"
            git ls-remote --heads origin | awk '{print $2}' | sed 's|^refs/heads/||'
            exit 1
          fi
          if [ "$MATCH" != "$REQUESTED" ]; then
            echo "Using existing branch '$MATCH' for requested '$REQUESTED'"
          fi
          git fetch --no-tags --depth=1 origin "$MATCH"
          git checkout --force -B "$MATCH" FETCH_HEAD
          echo "Checked out $MATCH @ $(git rev-parse --short HEAD)"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Create google-services.json (UAT)
        run: |
          mkdir -p app/src/stoptbUat
          echo '${{ secrets.GOOGLE_SERVICES_JSON_UAT }}' > app/src/stoptbUat/google-services.json

      - name: Create google-services.json (Prod)
        run: |
          mkdir -p app/src/stoptb
          echo '${{ secrets.GOOGLE_SERVICES_JSON_PROD }}' > app/src/stoptb/google-services.json

      - name: Accept SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses

      - name: Install NDK
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;29.0.14033849"

      - name: Set app version
        run: |
          echo "VERSION=${{ inputs.versionName }}" > version/version.properties
          echo "VERSIONCODE=${{ inputs.versionCode }}" >> version/version.properties

      - name: Create release keystore
        run: |
          KEYSTORE_PATH="$GITHUB_WORKSPACE/stoptb_signing_key.jks"
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          cat > "$GITHUB_WORKSPACE/keystore.properties" <<'EOF'
          storeFile=PLACEHOLDER_STORE_FILE
          storePassword=${{ secrets.RELEASE_STORE_PASSWORD }}
          keyAlias=${{ secrets.RELEASE_KEY_ALIAS }}
          keyPassword=${{ secrets.RELEASE_KEY_PASSWORD }}
          EOF
          sed -i "s|storeFile=PLACEHOLDER_STORE_FILE|storeFile=$KEYSTORE_PATH|" "$GITHUB_WORKSPACE/keystore.properties"
          test -f "$GITHUB_WORKSPACE/keystore.properties"
          test -f "$GITHUB_WORKSPACE/version/version.properties"

      - name: Build UAT Release APK
        env:
          ENCRYPTED_PASS_KEY: ${{ secrets.ENCRYPTED_PASS_KEY }}
          ABHA_CLIENT_SECRET: ${{ secrets.ABHA_CLIENT_SECRET }}
          ABHA_CLIENT_ID: ${{ secrets.ABHA_CLIENT_ID }}
          BASE_TMC_URL: ${{ secrets.BASE_TMC_URL }}
          BASE_ABHA_URL: ${{ secrets.BASE_ABHA_URL }}
          ABHA_TOKEN_URL: ${{ secrets.ABHA_TOKEN_URL }}
          ABHA_AUTH_URL: ${{ secrets.ABHA_AUTH_URL }}
          CHAT_URL: ${{ secrets.CHAT_URL }}
        run: ./gradlew assembleStoptbUatRelease --no-daemon

      - name: Verify APK is release-signed and not debuggable
        id: apk
        run: |
          set -euo pipefail
          RELEASE_DIR="app/build/outputs/apk/stoptbUat/release"
          echo "Release APKs:"
          ls -la "$RELEASE_DIR"

          APK="$RELEASE_DIR/app-stoptbUat-universal-release.apk"
          if [ ! -f "$APK" ]; then
            APK="$(find "$RELEASE_DIR" -name '*universal*release*.apk' | head -n 1 || true)"
          fi
          if [ -z "$APK" ] || [ ! -f "$APK" ]; then
            echo "Universal release APK not found in $RELEASE_DIR"
            exit 1
          fi

          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
          if [ ! -x "$BUILD_TOOLS/apksigner" ] || [ ! -x "$BUILD_TOOLS/aapt" ]; then
            echo "apksigner or aapt missing in $BUILD_TOOLS"
            exit 1
          fi

          echo "Using APK: $APK"
          echo "Using build-tools: $BUILD_TOOLS"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"

          CERTS="$("$BUILD_TOOLS/apksigner" verify --print-certs "$APK")"
          if echo "$CERTS" | grep -qi "CN=Android Debug"; then
            echo "ERROR: APK is signed with the Android debug certificate. Intune will reject this."
            exit 1
          fi

          BADGING="$("$BUILD_TOOLS/aapt" dump badging "$APK")"
          echo "$BADGING" | grep -E "package:|application-debuggable|sdkVersion|targetSdkVersion" || true
          if echo "$BADGING" | grep -q "application-debuggable"; then
            echo "ERROR: APK is marked debuggable. Intune will reject this as a debugging APK."
            exit 1
          fi

          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"
          echo "Verified: release-signed, not debuggable, ready for Intune."

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v5
        with:
          name: uat-release-apk
          path: app/build/outputs/apk/stoptbUat/release/*.apk

      - name: Distribute to Firebase App Distribution (UAT)
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID_UAT }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          groups: testers
          file: ${{ steps.apk.outputs.apk_path }}
          releaseNotes: |
            Environment: UAT (signed release)
            Version: ${{ inputs.versionName }} (${{ inputs.versionCode }})
            Branch: ${{ inputs.branch }}
            Commit: ${{ github.sha }}
            Description: ${{ inputs.description }}
