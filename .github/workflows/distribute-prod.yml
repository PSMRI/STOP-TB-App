name: StopTB PROD Build
run-name: STOP TB Android Build - PROD ${{ inputs.versionName }} (${{ inputs.versionCode }}) [${{ inputs.publishTo }}]

on:
  workflow_dispatch:
    inputs:
      versionName:
        description: 'Version name (example: 1.0.3)'
        required: true
        type: string
        default: '1.0.3'
      versionCode:
        description: 'Positive integer, must be higher than the last Play Internal version code (example: 4)'
        required: true
        type: string
        default: '4'
      publishTo:
        description: 'firebase-apk = Firebase App Distribution. play-internal-aab = Play Internal testing. both = APK then AAB. Do not install a Firebase APK over a Play build (or the reverse) without uninstalling first.'
        required: true
        type: choice
        default: both
        options:
          - firebase-apk
          - play-internal-aab
          - both

permissions:
  contents: read

concurrency:
  group: distribute-prod-${{ github.ref }}-${{ inputs.publishTo }}
  cancel-in-progress: true

jobs:
  build-and-distribute:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      ENCRYPTED_PASS_KEY: ${{ secrets.ENCRYPTED_PASS_KEY }}
      ABHA_CLIENT_SECRET: ${{ secrets.ABHA_CLIENT_SECRET }}
      ABHA_CLIENT_ID: ${{ secrets.ABHA_CLIENT_ID }}
      BASE_TMC_URL: ${{ secrets.BASE_TMC_URL }}
      BASE_ABHA_URL: ${{ secrets.BASE_ABHA_URL }}
      ABHA_TOKEN_URL: ${{ secrets.ABHA_TOKEN_URL }}
      ABHA_AUTH_URL: ${{ secrets.ABHA_AUTH_URL }}
      CHAT_URL: ${{ secrets.CHAT_URL }}

    steps:
      - name: Check required secrets
        env:
          PUBLISH_TO: ${{ inputs.publishTo }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          GOOGLE_SERVICES_JSON_UAT: ${{ secrets.GOOGLE_SERVICES_JSON_UAT }}
          GOOGLE_SERVICES_JSON_PROD: ${{ secrets.GOOGLE_SERVICES_JSON_PROD }}
          FIREBASE_APP_ID_PROD: ${{ secrets.FIREBASE_APP_ID_PROD }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          missing=0
          for name in RELEASE_KEYSTORE_BASE64 RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD GOOGLE_SERVICES_JSON_UAT GOOGLE_SERVICES_JSON_PROD; do
            if [ -z "${!name}" ]; then
              echo "Missing required secret: $name"
              missing=1
            fi
          done
          if [ "$PUBLISH_TO" != "play-internal-aab" ]; then
            for name in FIREBASE_APP_ID_PROD FIREBASE_SERVICE_ACCOUNT_JSON; do
              if [ -z "${!name}" ]; then
                echo "Missing required secret: $name"
                missing=1
              fi
            done
          fi
          if [ "$PUBLISH_TO" != "firebase-apk" ]; then
            if [ -z "${GOOGLE_PLAY_SERVICE_ACCOUNT_JSON}" ]; then
              echo "Missing required secret: GOOGLE_PLAY_SERVICE_ACCOUNT_JSON"
              missing=1
            fi
          fi
          if [ "$missing" -ne 0 ]; then
            echo "Add the missing repository secrets, then re-run this workflow."
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Create google-services.json
        env:
          GOOGLE_SERVICES_JSON_UAT: ${{ secrets.GOOGLE_SERVICES_JSON_UAT }}
          GOOGLE_SERVICES_JSON_PROD: ${{ secrets.GOOGLE_SERVICES_JSON_PROD }}
        run: |
          set -euo pipefail
          mkdir -p app/src/stoptbUat app/src/stoptb
          printf '%s\n' "$GOOGLE_SERVICES_JSON_UAT" > app/src/stoptbUat/google-services.json
          printf '%s\n' "$GOOGLE_SERVICES_JSON_PROD" > app/src/stoptb/google-services.json
          test -s app/src/stoptbUat/google-services.json
          test -s app/src/stoptb/google-services.json
          python3 -c "import json; json.load(open('app/src/stoptbUat/google-services.json')); json.load(open('app/src/stoptb/google-services.json'))"

      - name: Accept SDK licenses
        run: yes 2>/dev/null | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Install NDK
        run: "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.14033849"

      - name: Set app version
        env:
          VERSION_NAME: ${{ inputs.versionName }}
          VERSION_CODE: ${{ inputs.versionCode }}
        run: |
          set -euo pipefail
          if [ -z "${VERSION_CODE}" ] || ! [[ "${VERSION_CODE}" =~ ^[1-9][0-9]*$ ]]; then
            echo "versionCode must be a positive integer (got: '${VERSION_CODE}')."
            echo "For Play Internal, use a value higher than the last uploaded version code."
            exit 1
          fi
          if [ -z "${VERSION_NAME}" ]; then
            echo "versionName is required (got: '${VERSION_NAME}')."
            exit 1
          fi
          printf 'VERSION=%s\nVERSIONCODE=%s\n' "${VERSION_NAME}" "${VERSION_CODE}" > version/version.properties
          echo "Using app version:"
          cat version/version.properties

      - name: Create release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$GITHUB_WORKSPACE/stoptb_signing_key.jks"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          python3 <<'PY'
          import os
          from pathlib import Path
          workspace = Path(os.environ["GITHUB_WORKSPACE"])
          store_file = workspace / "stoptb_signing_key.jks"
          (workspace / "keystore.properties").write_text(
              "storeFile={}\nstorePassword={}\nkeyAlias={}\nkeyPassword={}\n".format(
                  store_file,
                  os.environ["RELEASE_STORE_PASSWORD"],
                  os.environ["RELEASE_KEY_ALIAS"],
                  os.environ["RELEASE_KEY_PASSWORD"],
              )
          )
          PY
          test -s "$GITHUB_WORKSPACE/keystore.properties"

      - name: Announce publish channel
        run: |
          echo "Publishing ${{ inputs.versionName }} (${{ inputs.versionCode }}) to ${{ inputs.publishTo }}"
          echo "Firebase testers get a fat APK. Play Internal testers get an AAB (Play splits it at install time)."
          echo "Do not install a Firebase APK over a Play Internal install (or the reverse) without uninstalling first."

      - name: Build PROD Release APK
        if: ${{ inputs.publishTo != 'play-internal-aab' }}
        run: ./gradlew assembleStoptbRelease --no-daemon --stacktrace

      - name: Verify fat APK
        if: ${{ inputs.publishTo != 'play-internal-aab' }}
        id: apk
        run: |
          set -euo pipefail
          RELEASE_DIR="app/build/outputs/apk/stoptb/release"
          echo "Release APKs:"
          ls -la "$RELEASE_DIR"

          APK="$RELEASE_DIR/app-stoptb-release.apk"
          if [ ! -f "$APK" ]; then
            APK="$RELEASE_DIR/app-stoptb-universal-release.apk"
          fi
          if [ ! -f "$APK" ]; then
            APK="$(find "$RELEASE_DIR" -name '*release*.apk' ! -name '*-armeabi-*' ! -name '*-arm64-*' ! -name '*-x86*' | head -n 1 || true)"
          fi
          if [ -z "$APK" ] || [ ! -f "$APK" ]; then
            echo "ERROR: Fat release APK not found in $RELEASE_DIR"
            exit 1
          fi

          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
          if [ ! -x "$BUILD_TOOLS/aapt" ]; then
            echo "aapt missing in $BUILD_TOOLS"
            exit 1
          fi

          echo "Using APK: $APK"
          BADGING="$("$BUILD_TOOLS/aapt" dump badging "$APK")"
          echo "$BADGING" | grep -E "package:|native-code:|application-debuggable" || true
          if echo "$BADGING" | grep -qE "^split[ =]"; then
            echo "ERROR: APK is a config split, not a fat APK. This would cause INSTALL_FAILED_MISSING_SPLIT."
            exit 1
          fi
          if echo "$BADGING" | grep -q "application-debuggable"; then
            echo "ERROR: APK is marked debuggable."
            exit 1
          fi

          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK as GitHub artifact
        if: ${{ inputs.publishTo != 'play-internal-aab' }}
        uses: actions/upload-artifact@v5
        with:
          name: prod-release-apk
          path: ${{ steps.apk.outputs.apk_path }}

      - name: Distribute APK to Firebase App Distribution
        if: ${{ inputs.publishTo != 'play-internal-aab' }}
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID_PROD }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          groups: testers
          file: ${{ steps.apk.outputs.apk_path }}
          releaseNotes: |
            Environment: PROD
            Channel: Firebase APK
            Version: ${{ inputs.versionName }} (${{ inputs.versionCode }})
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}

      - name: Build PROD Release AAB
        if: ${{ inputs.publishTo != 'firebase-apk' }}
        run: ./gradlew bundleStoptbRelease --no-daemon --stacktrace

      - name: Find and prepare AAB
        if: ${{ inputs.publishTo != 'firebase-apk' }}
        id: aab
        run: |
          set -euo pipefail
          AAB_FILE="$(find app/build/outputs/bundle -type f -name '*.aab' | head -n 1 || true)"
          if [ -z "$AAB_FILE" ] || [ ! -f "$AAB_FILE" ]; then
            echo "ERROR: AAB file not found"
            find app/build/outputs/bundle -type f || true
            exit 1
          fi
          echo "AAB found at: $AAB_FILE"
          cp "$AAB_FILE" app-stoptb-release.aab
          echo "aab_path=app-stoptb-release.aab" >> "$GITHUB_OUTPUT"

          MAPPING_FILE="app/build/outputs/mapping/stoptbRelease/mapping.txt"
          if [ -f "$MAPPING_FILE" ]; then
            echo "mapping_file=$MAPPING_FILE" >> "$GITHUB_OUTPUT"
          else
            echo "WARNING: mapping.txt not found at $MAPPING_FILE"
            find app/build/outputs/mapping -type f || true
          fi

      - name: Upload AAB as GitHub artifact
        if: ${{ inputs.publishTo != 'firebase-apk' }}
        uses: actions/upload-artifact@v5
        with:
          name: prod-release-aab
          path: app-stoptb-release.aab

      - name: Upload AAB to Google Play Internal Testing
        if: ${{ inputs.publishTo != 'firebase-apk' && steps.aab.outputs.mapping_file != '' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: org.piramalswasthya.stoptb
          releaseFiles: app-stoptb-release.aab
          tracks: internal
          status: completed
          mappingFile: ${{ steps.aab.outputs.mapping_file }}

      - name: Upload AAB to Google Play Internal Testing
        if: ${{ inputs.publishTo != 'firebase-apk' && steps.aab.outputs.mapping_file == '' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: org.piramalswasthya.stoptb
          releaseFiles: app-stoptb-release.aab
          tracks: internal
          status: completed
