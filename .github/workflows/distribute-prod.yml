name: StopTB PROD Build
run-name: STOP TB Android Build - PROD ${{ inputs.versionName }} (${{ inputs.versionCode }}) [${{ inputs.publishTo }}]

on:
  workflow_dispatch:
    inputs:
      versionName:
        description: 'Version name (example: 1.0.3)'
        required: true
        type: string
        default: '1.0.2'
      versionCode:
        description: 'Version code, must be a positive integer greater than the last Play Store upload (example: 4)'
        required: true
        type: string
        default: '3'
      publishTo:
        description: 'Publish to one channel only. Mixing Play Internal (AAB splits) and Firebase (APK) on the same device causes INSTALL_FAILED_MISSING_SPLIT (-28). Uninstall before switching channels.'
        required: true
        type: choice
        default: firebase-apk
        options:
          - firebase-apk
          - play-internal-aab

permissions:
  contents: read

concurrency:
  group: distribute-prod-${{ github.ref }}-${{ inputs.publishTo }}
  cancel-in-progress: true

jobs:
  build-and-distribute:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      ENCRYPTED_PASS_KEY: ${{ secrets.ENCRYPTED_PASS_KEY }}
      ABHA_CLIENT_SECRET: ${{ secrets.ABHA_CLIENT_SECRET }}
      ABHA_CLIENT_ID: ${{ secrets.ABHA_CLIENT_ID }}
      BASE_TMC_URL: ${{ secrets.BASE_TMC_URL }}
      BASE_ABHA_URL: ${{ secrets.BASE_ABHA_URL }}
      ABHA_TOKEN_URL: ${{ secrets.ABHA_TOKEN_URL }}
      ABHA_AUTH_URL: ${{ secrets.ABHA_AUTH_URL }}
      CHAT_URL: ${{ secrets.CHAT_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Create google-services.json (UAT)
        run: |
          mkdir -p app/src/stoptbUat
          echo '${{ secrets.GOOGLE_SERVICES_JSON_UAT }}' > app/src/stoptbUat/google-services.json

      - name: Create google-services.json (Prod)
        run: |
          mkdir -p app/src/stoptb
          echo '${{ secrets.GOOGLE_SERVICES_JSON_PROD }}' > app/src/stoptb/google-services.json

      - name: Accept SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses

      - name: Install NDK
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;29.0.14033849"

      - name: Set app version
        env:
          VERSION_NAME: ${{ inputs.versionName }}
          VERSION_CODE: ${{ inputs.versionCode }}
        run: |
          set -euo pipefail
          if [ -z "${VERSION_CODE}" ] || ! [[ "${VERSION_CODE}" =~ ^[1-9][0-9]*$ ]]; then
            echo "versionCode must be a positive integer (got: '${VERSION_CODE}')."
            echo "Re-run the workflow with a version code greater than 0, and higher than the last Play Store internal upload."
            exit 1
          fi
          if [ -z "${VERSION_NAME}" ]; then
            echo "versionName is required (got: '${VERSION_NAME}')."
            exit 1
          fi
          printf 'VERSION=%s\nVERSIONCODE=%s\n' "${VERSION_NAME}" "${VERSION_CODE}" > version/version.properties
          echo "Using app version:"
          cat version/version.properties

      - name: Create release keystore
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > stoptb_signing_key.jks
          cat > keystore.properties <<'EOF'
          storeFile=../stoptb_signing_key.jks
          storePassword=${{ secrets.RELEASE_STORE_PASSWORD }}
          keyAlias=${{ secrets.RELEASE_KEY_ALIAS }}
          keyPassword=${{ secrets.RELEASE_KEY_PASSWORD }}
          EOF

      - name: Announce publish channel
        run: |
          echo "Publishing ${{ inputs.versionName }} (${{ inputs.versionCode }}) to ${{ inputs.publishTo }}"
          echo "Do not install a Firebase APK over a Play Internal install (or the reverse)."
          echo "That fails with INSTALL_FAILED_MISSING_SPLIT (-28). Uninstall first to switch channels."

      - name: Build PROD Release APK
        if: ${{ inputs.publishTo == 'firebase-apk' }}
        run: ./gradlew assembleStoptbRelease --no-daemon

      - name: Verify fat APK
        if: ${{ inputs.publishTo == 'firebase-apk' }}
        id: apk
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/stoptb/release/app-stoptb-release.apk"
          if [ ! -f "$APK" ]; then
            echo "Expected fat APK not found: $APK"
            ls -la app/build/outputs/apk/stoptb/release || true
            exit 1
          fi
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
          BADGING="$("$BUILD_TOOLS/aapt" dump badging "$APK")"
          echo "$BADGING" | grep -E "package:|native-code:|application-debuggable" || true
          if echo "$BADGING" | grep -qE "^split[ =]"; then
            echo "ERROR: APK is a config split, not a fat APK. This would cause INSTALL_FAILED_MISSING_SPLIT."
            exit 1
          fi
          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK as GitHub artifact
        if: ${{ inputs.publishTo == 'firebase-apk' }}
        uses: actions/upload-artifact@v5
        with:
          name: prod-release-apk
          path: app/build/outputs/apk/stoptb/release/app-stoptb-release.apk

      - name: Distribute APK to Firebase App Distribution
        if: ${{ inputs.publishTo == 'firebase-apk' }}
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID_PROD }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          groups: testers
          file: ${{ steps.apk.outputs.apk_path }}
          releaseNotes: |
            Environment: PROD
            Channel: Firebase APK
            Version: ${{ github.event.inputs.versionName }} (${{ github.event.inputs.versionCode }})
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}

      - name: Build PROD Release AAB
        if: ${{ inputs.publishTo == 'play-internal-aab' }}
        run: ./gradlew bundleStoptbRelease --no-daemon

      - name: Find and prepare AAB
        if: ${{ inputs.publishTo == 'play-internal-aab' }}
        id: aab
        run: |
          set -euo pipefail
          AAB_FILE="$(find app/build/outputs/bundle -type f -name '*.aab' | head -n 1 || true)"
          if [ -z "$AAB_FILE" ] || [ ! -f "$AAB_FILE" ]; then
            echo "ERROR: AAB file not found"
            find app/build/outputs/bundle -type f || true
            exit 1
          fi
          echo "AAB found at: $AAB_FILE"
          cp "$AAB_FILE" app-stoptb-release.aab
          echo "aab_path=app-stoptb-release.aab" >> "$GITHUB_OUTPUT"

          MAPPING_FILE="app/build/outputs/mapping/stoptbRelease/mapping.txt"
          if [ -f "$MAPPING_FILE" ]; then
            echo "mapping_file=$MAPPING_FILE" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload AAB as GitHub artifact
        if: ${{ inputs.publishTo == 'play-internal-aab' }}
        uses: actions/upload-artifact@v5
        with:
          name: prod-release-aab
          path: app-stoptb-release.aab

      - name: Upload AAB to Google Play Internal Testing
        if: ${{ inputs.publishTo == 'play-internal-aab' && steps.aab.outputs.mapping_file != '' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: org.piramalswasthya.stoptb
          releaseFiles: app-stoptb-release.aab
          tracks: internal
          status: completed
          mappingFile: ${{ steps.aab.outputs.mapping_file }}
          changesNotSentForReview: true

      - name: Upload AAB to Google Play Internal Testing
        if: ${{ inputs.publishTo == 'play-internal-aab' && steps.aab.outputs.mapping_file == '' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: org.piramalswasthya.stoptb
          releaseFiles: app-stoptb-release.aab
          tracks: internal
          status: completed
          changesNotSentForReview: true
