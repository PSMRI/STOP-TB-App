name: StopTB Build & Distribute
run-name: STOP TB ${{ inputs.environment }} ${{ inputs.signing }} - ${{ inputs.versionName }} (${{ inputs.versionCode }}) [${{ inputs.branch }}]

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment (flavor and secrets)'
        required: true
        type: choice
        default: uat
        options:
          - uat
          - prod
      signing:
        description: 'debug = testers/Firebase only. signed = required for Play Internal and Intune MDM.'
        required: true
        type: choice
        default: signed
        options:
          - debug
          - signed
      distributeFirebase:
        description: 'Upload APK to Firebase App Distribution'
        required: true
        type: boolean
        default: true
      distributeIntune:
        description: 'Upload signed APK to Intune MDM (uat uses UAT Azure/Intune secrets, prod uses PROD secrets). Signed builds only.'
        required: true
        type: boolean
        default: false
      distributePlay:
        description: 'Upload AAB to Google Play Internal (prod signed only)'
        required: true
        type: boolean
        default: false
      description:
        description: 'Release notes / description for this build'
        required: false
        type: string
        default: ''
      branch:
        description: 'Git branch to build from. Matching is case-insensitive.'
        required: true
        type: string
        default: 'release-2.3'
      versionName:
        description: 'Build version (example: 1.0.3)'
        required: true
        type: string
        default: '1.0.3'
      versionCode:
        description: 'Build number (example: 4). For Play, must be higher than the last uploaded version code.'
        required: true
        type: string
        default: '4'

permissions:
  contents: read
  id-token: write

concurrency:
  group: distribute-${{ inputs.environment }}-${{ inputs.signing }}-${{ inputs.branch }}
  cancel-in-progress: true

jobs:
  build-and-distribute:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Resolve build plan
        id: plan
        env:
          TARGET_ENV: ${{ inputs.environment }}
          SIGNING: ${{ inputs.signing }}
          WANT_FIREBASE: ${{ inputs.distributeFirebase }}
          WANT_INTUNE: ${{ inputs.distributeIntune }}
          WANT_PLAY: ${{ inputs.distributePlay }}
          ENCRYPTED_PASS_KEY: ${{ secrets.ENCRYPTED_PASS_KEY }}
          ENCRYPTED_PASS_KEY_UAT: ${{ secrets.ENCRYPTED_PASS_KEY_UAT }}
          ENCRYPTED_PASS_KEY_PROD: ${{ secrets.ENCRYPTED_PASS_KEY_PROD }}
          ABHA_CLIENT_SECRET: ${{ secrets.ABHA_CLIENT_SECRET }}
          ABHA_CLIENT_SECRET_UAT: ${{ secrets.ABHA_CLIENT_SECRET_UAT }}
          ABHA_CLIENT_SECRET_PROD: ${{ secrets.ABHA_CLIENT_SECRET_PROD }}
          ABHA_CLIENT_ID: ${{ secrets.ABHA_CLIENT_ID }}
          ABHA_CLIENT_ID_UAT: ${{ secrets.ABHA_CLIENT_ID_UAT }}
          ABHA_CLIENT_ID_PROD: ${{ secrets.ABHA_CLIENT_ID_PROD }}
          BASE_TMC_URL: ${{ secrets.BASE_TMC_URL }}
          BASE_TMC_URL_UAT: ${{ secrets.BASE_TMC_URL_UAT }}
          BASE_TMC_URL_PROD: ${{ secrets.BASE_TMC_URL_PROD }}
          BASE_ABHA_URL: ${{ secrets.BASE_ABHA_URL }}
          BASE_ABHA_URL_UAT: ${{ secrets.BASE_ABHA_URL_UAT }}
          BASE_ABHA_URL_PROD: ${{ secrets.BASE_ABHA_URL_PROD }}
          ABHA_TOKEN_URL: ${{ secrets.ABHA_TOKEN_URL }}
          ABHA_TOKEN_URL_UAT: ${{ secrets.ABHA_TOKEN_URL_UAT }}
          ABHA_TOKEN_URL_PROD: ${{ secrets.ABHA_TOKEN_URL_PROD }}
          ABHA_AUTH_URL: ${{ secrets.ABHA_AUTH_URL }}
          ABHA_AUTH_URL_UAT: ${{ secrets.ABHA_AUTH_URL_UAT }}
          ABHA_AUTH_URL_PROD: ${{ secrets.ABHA_AUTH_URL_PROD }}
          CHAT_URL: ${{ secrets.CHAT_URL }}
          CHAT_URL_UAT: ${{ secrets.CHAT_URL_UAT }}
          CHAT_URL_PROD: ${{ secrets.CHAT_URL_PROD }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_APP_ID_UAT: ${{ secrets.FIREBASE_APP_ID_UAT }}
          FIREBASE_APP_ID_PROD: ${{ secrets.FIREBASE_APP_ID_PROD }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_ID_UAT: ${{ secrets.AZURE_CLIENT_ID_UAT }}
          AZURE_CLIENT_ID_PROD: ${{ secrets.AZURE_CLIENT_ID_PROD }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_TENANT_ID_UAT: ${{ secrets.AZURE_TENANT_ID_UAT }}
          AZURE_TENANT_ID_PROD: ${{ secrets.AZURE_TENANT_ID_PROD }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_CLIENT_SECRET_UAT: ${{ secrets.AZURE_CLIENT_SECRET_UAT }}
          AZURE_CLIENT_SECRET_PROD: ${{ secrets.AZURE_CLIENT_SECRET_PROD }}
          INTUNE_GROUP_ID: ${{ secrets.INTUNE_GROUP_ID }}
          INTUNE_GROUP_ID_UAT: ${{ secrets.INTUNE_GROUP_ID_UAT }}
          INTUNE_GROUP_ID_PROD: ${{ secrets.INTUNE_GROUP_ID_PROD }}
          INTUNE_APP_ID: ${{ secrets.INTUNE_APP_ID }}
          INTUNE_APP_ID_UAT: ${{ secrets.INTUNE_APP_ID_UAT }}
          INTUNE_APP_ID_PROD: ${{ secrets.INTUNE_APP_ID_PROD }}
        run: |
          set -euo pipefail
          pick() {
            if [ -n "${1:-}" ]; then
              printf '%s' "$1"
            else
              printf '%s' "${2:-}"
            fi
          }
          pick_env() {
            local base="$1"
            local suffixed_name="${base}_${SUFFIX}"
            pick "${!suffixed_name:-}" "${!base:-}"
          }

          if [ "$WANT_INTUNE" = true ] && [ "$SIGNING" != signed ]; then
            echo "Intune MDM requires a signed release APK. Debug APKs are rejected."
            exit 1
          fi
          if [ "$WANT_PLAY" = true ] && { [ "$TARGET_ENV" != prod ] || [ "$SIGNING" != signed ]; }; then
            echo "Play Internal is only available for prod signed AAB uploads."
            exit 1
          fi

          if [ "$TARGET_ENV" = prod ]; then
            SUFFIX=PROD
            PACKAGE_ID=org.piramalswasthya.stoptb
            FLAVOR_DIR=stoptb
            APK_NAME=app-stoptb
            GRADLE_AAB_TASK=bundleStoptbRelease
            FIREBASE_LABEL=PROD
            INTUNE_DISPLAY_NAME=STOPTB
          else
            SUFFIX=UAT
            PACKAGE_ID=org.piramalswasthya.stoptb.uat
            FLAVOR_DIR=stoptbUat
            APK_NAME=app-stoptbUat
            GRADLE_AAB_TASK=
            FIREBASE_LABEL=UAT
            INTUNE_DISPLAY_NAME=STOPTB_UAT
          fi

          if [ "$SIGNING" = signed ]; then
            APK_VARIANT=release
            ARTIFACT_APK="${TARGET_ENV}-release-apk"
            if [ "$TARGET_ENV" = prod ]; then
              GRADLE_APK_TASK=assembleStoptbRelease
            else
              GRADLE_APK_TASK=assembleStoptbUatRelease
            fi
          else
            APK_VARIANT=debug
            ARTIFACT_APK="${TARGET_ENV}-debug-apk"
            if [ "$TARGET_ENV" = prod ]; then
              GRADLE_APK_TASK=assembleStoptbDebug
            else
              GRADLE_APK_TASK=assembleStoptbUatDebug
            fi
          fi

          DO_FIREBASE="$WANT_FIREBASE"
          DO_INTUNE="$WANT_INTUNE"
          DO_PLAY="$WANT_PLAY"
          DO_APK=true
          if [ "$DO_PLAY" = true ] && [ "$DO_FIREBASE" != true ] && [ "$DO_INTUNE" != true ]; then
            DO_APK=false
          fi

          {
            echo "package_id=$PACKAGE_ID"
            echo "apk_dir=app/build/outputs/apk/${FLAVOR_DIR}/${APK_VARIANT}"
            echo "apk_name=$APK_NAME"
            echo "apk_variant=$APK_VARIANT"
            echo "artifact_apk=$ARTIFACT_APK"
            echo "gradle_apk_task=$GRADLE_APK_TASK"
            echo "gradle_aab_task=$GRADLE_AAB_TASK"
            echo "firebase_label=$FIREBASE_LABEL"
            echo "intune_display_name=$INTUNE_DISPLAY_NAME"
            echo "do_apk=$DO_APK"
            echo "do_firebase=$DO_FIREBASE"
            echo "do_intune=$DO_INTUNE"
            echo "do_play=$DO_PLAY"
          } >> "$GITHUB_OUTPUT"

          {
            echo "ENCRYPTED_PASS_KEY=$(pick_env ENCRYPTED_PASS_KEY)"
            echo "ABHA_CLIENT_SECRET=$(pick_env ABHA_CLIENT_SECRET)"
            echo "ABHA_CLIENT_ID=$(pick_env ABHA_CLIENT_ID)"
            echo "BASE_TMC_URL=$(pick_env BASE_TMC_URL)"
            echo "BASE_ABHA_URL=$(pick_env BASE_ABHA_URL)"
            echo "ABHA_TOKEN_URL=$(pick_env ABHA_TOKEN_URL)"
            echo "ABHA_AUTH_URL=$(pick_env ABHA_AUTH_URL)"
            echo "CHAT_URL=$(pick_env CHAT_URL)"
            echo "FIREBASE_APP_ID=$(pick_env FIREBASE_APP_ID)"
            echo "AZURE_CLIENT_ID=$(pick_env AZURE_CLIENT_ID)"
            echo "AZURE_TENANT_ID=$(pick_env AZURE_TENANT_ID)"
            echo "AZURE_CLIENT_SECRET=$(pick_env AZURE_CLIENT_SECRET)"
            echo "INTUNE_GROUP_ID=$(pick_env INTUNE_GROUP_ID)"
            echo "INTUNE_APP_ID=$(pick_env INTUNE_APP_ID)"
          } >> "$GITHUB_ENV"

          echo "Plan: env=$TARGET_ENV signing=$SIGNING apk=$DO_APK firebase=$DO_FIREBASE intune=$DO_INTUNE play=$DO_PLAY"

      - name: Check required secrets
        env:
          TARGET_ENV: ${{ inputs.environment }}
          SIGNING: ${{ inputs.signing }}
          DO_APK: ${{ steps.plan.outputs.do_apk }}
          DO_FIREBASE: ${{ steps.plan.outputs.do_firebase }}
          DO_INTUNE: ${{ steps.plan.outputs.do_intune }}
          DO_PLAY: ${{ steps.plan.outputs.do_play }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          DEBUG_KEYSTORE_FILE: ${{ secrets.DEBUG_KEYSTORE_FILE }}
          DEBUG_KEYSTORE_PASSWORD: ${{ secrets.DEBUG_KEYSTORE_PASSWORD }}
          DEBUG_KEY_ALIAS: ${{ secrets.DEBUG_KEY_ALIAS }}
          DEBUG_KEY_PASSWORD: ${{ secrets.DEBUG_KEY_PASSWORD }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SERVICES_JSON_UAT: ${{ secrets.GOOGLE_SERVICES_JSON_UAT }}
          GOOGLE_SERVICES_JSON_PROD: ${{ secrets.GOOGLE_SERVICES_JSON_PROD }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          missing=0
          require() {
            local name="$1"
            if [ -z "${!name:-}" ]; then
              echo "Missing required secret/value for $TARGET_ENV $SIGNING: $name"
              missing=1
            fi
          }

          require GOOGLE_SERVICES_JSON_UAT
          require GOOGLE_SERVICES_JSON_PROD
          require ENCRYPTED_PASS_KEY
          require ABHA_CLIENT_ID
          require ABHA_CLIENT_SECRET
          require BASE_TMC_URL

          if [ "$SIGNING" = signed ]; then
            require RELEASE_KEYSTORE_BASE64
            require RELEASE_STORE_PASSWORD
            require RELEASE_KEY_ALIAS
            require RELEASE_KEY_PASSWORD
          elif [ "$DO_APK" = true ]; then
            require DEBUG_KEYSTORE_FILE
            require DEBUG_KEYSTORE_PASSWORD
            require DEBUG_KEY_ALIAS
            require DEBUG_KEY_PASSWORD
          fi

          if [ "$DO_FIREBASE" = true ]; then
            require FIREBASE_APP_ID
            require FIREBASE_SERVICE_ACCOUNT_JSON
          fi
          if [ "$DO_INTUNE" = true ]; then
            require AZURE_CLIENT_ID
            require AZURE_TENANT_ID
            require INTUNE_GROUP_ID
          fi
          if [ "$DO_PLAY" = true ]; then
            require GOOGLE_PLAY_SERVICE_ACCOUNT_JSON
          fi

          if [ "$missing" -ne 0 ]; then
            echo "Add the missing repository secrets, then re-run this workflow."
            echo "UAT uses *_UAT secrets (or unsuffixed fallback). PROD uses *_PROD secrets (or unsuffixed fallback)."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Preserve Intune upload script
        if: ${{ steps.plan.outputs.do_intune == 'true' }}
        run: cp .github/scripts/upload_intune_android_lob.py "$RUNNER_TEMP/upload_intune_android_lob.py"

      - name: Checkout requested branch
        run: |
          set -euo pipefail
          REQUESTED="${{ inputs.branch }}"
          MATCH="$(git ls-remote --heads origin | awk '{print $2}' | sed 's|^refs/heads/||' | grep -ixF -- "$REQUESTED" | head -n 1 || true)"
          if [ -z "$MATCH" ]; then
            echo "Branch not found: '$REQUESTED'"
            echo "Available branches:"
            git ls-remote --heads origin | awk '{print $2}' | sed 's|^refs/heads/||'
            exit 1
          fi
          if [ "$MATCH" != "$REQUESTED" ]; then
            echo "Using existing branch '$MATCH' for requested '$REQUESTED'"
          fi
          git fetch --no-tags --depth=1 origin "$MATCH"
          git checkout --force -B "$MATCH" FETCH_HEAD
          echo "Checked out $MATCH @ $(git rev-parse --short HEAD)"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Create google-services.json
        env:
          GOOGLE_SERVICES_JSON_UAT: ${{ secrets.GOOGLE_SERVICES_JSON_UAT }}
          GOOGLE_SERVICES_JSON_PROD: ${{ secrets.GOOGLE_SERVICES_JSON_PROD }}
        run: |
          set -euo pipefail
          mkdir -p app/src/stoptbUat app/src/stoptb
          printf '%s\n' "$GOOGLE_SERVICES_JSON_UAT" > app/src/stoptbUat/google-services.json
          printf '%s\n' "$GOOGLE_SERVICES_JSON_PROD" > app/src/stoptb/google-services.json
          test -s app/src/stoptbUat/google-services.json
          test -s app/src/stoptb/google-services.json
          python3 -c "import json; json.load(open('app/src/stoptbUat/google-services.json')); json.load(open('app/src/stoptb/google-services.json'))"

      - name: Accept SDK licenses
        run: yes 2>/dev/null | sdkmanager --licenses >/dev/null || true

      - name: Install NDK
        run: sdkmanager "ndk;29.0.14033849"

      - name: Set app version
        env:
          VERSION_NAME: ${{ inputs.versionName }}
          VERSION_CODE: ${{ inputs.versionCode }}
        run: |
          set -euo pipefail
          if [ -z "${VERSION_CODE}" ] || ! [[ "${VERSION_CODE}" =~ ^[1-9][0-9]*$ ]]; then
            echo "versionCode must be a positive integer (got: '${VERSION_CODE}')."
            echo "For Play Internal, use a value higher than the last uploaded version code."
            exit 1
          fi
          if [ -z "${VERSION_NAME}" ]; then
            echo "versionName is required (got: '${VERSION_NAME}')."
            exit 1
          fi
          printf 'VERSION=%s\nVERSIONCODE=%s\n' "${VERSION_NAME}" "${VERSION_CODE}" > version/version.properties
          echo "Using app version:"
          cat version/version.properties

      - name: Create debug keystore
        if: ${{ inputs.signing == 'debug' && steps.plan.outputs.do_apk == 'true' }}
        env:
          DEBUG_KEYSTORE_FILE: ${{ secrets.DEBUG_KEYSTORE_FILE }}
        run: |
          set -euo pipefail
          printf '%s' "$DEBUG_KEYSTORE_FILE" | base64 --decode > "$GITHUB_WORKSPACE/app/debug-keystore.jks"
          test -s "$GITHUB_WORKSPACE/app/debug-keystore.jks"

      - name: Create release keystore
        if: ${{ inputs.signing == 'signed' }}
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$GITHUB_WORKSPACE/stoptb_signing_key.jks"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          python3 <<'PY'
          import os
          from pathlib import Path
          workspace = Path(os.environ["GITHUB_WORKSPACE"])
          store_file = workspace / "stoptb_signing_key.jks"
          (workspace / "keystore.properties").write_text(
              "storeFile={}\nstorePassword={}\nkeyAlias={}\nkeyPassword={}\n".format(
                  store_file,
                  os.environ["RELEASE_STORE_PASSWORD"],
                  os.environ["RELEASE_KEY_ALIAS"],
                  os.environ["RELEASE_KEY_PASSWORD"],
              )
          )
          PY
          test -s "$GITHUB_WORKSPACE/keystore.properties"

      - name: Build debug APK
        if: ${{ inputs.signing == 'debug' && steps.plan.outputs.do_apk == 'true' }}
        env:
          DEBUG_KEYSTORE_PASSWORD: ${{ secrets.DEBUG_KEYSTORE_PASSWORD }}
          DEBUG_KEY_ALIAS: ${{ secrets.DEBUG_KEY_ALIAS }}
          DEBUG_KEY_PASSWORD: ${{ secrets.DEBUG_KEY_PASSWORD }}
        run: >
          ./gradlew ${{ steps.plan.outputs.gradle_apk_task }} --no-daemon --stacktrace
          -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/app/debug-keystore.jks
          -Pandroid.injected.signing.store.password=$DEBUG_KEYSTORE_PASSWORD
          -Pandroid.injected.signing.key.alias=$DEBUG_KEY_ALIAS
          -Pandroid.injected.signing.key.password=$DEBUG_KEY_PASSWORD

      - name: Build signed APK
        if: ${{ inputs.signing == 'signed' && steps.plan.outputs.do_apk == 'true' }}
        run: ./gradlew ${{ steps.plan.outputs.gradle_apk_task }} --no-daemon --stacktrace

      - name: Verify APK
        if: ${{ steps.plan.outputs.do_apk == 'true' }}
        id: apk
        env:
          SIGNING: ${{ inputs.signing }}
          TARGET_ENV: ${{ inputs.environment }}
          RELEASE_DIR: ${{ steps.plan.outputs.apk_dir }}
          NAME: ${{ steps.plan.outputs.apk_name }}
          VARIANT: ${{ steps.plan.outputs.apk_variant }}
        run: |
          set -euo pipefail
          echo "APKs:"
          ls -la "$RELEASE_DIR"

          APK="$RELEASE_DIR/${NAME}-${VARIANT}.apk"
          if [ ! -f "$APK" ]; then
            APK="$RELEASE_DIR/${NAME}-universal-${VARIANT}.apk"
          fi
          if [ ! -f "$APK" ]; then
            APK="$(find "$RELEASE_DIR" -name "*${VARIANT}*.apk" ! -name '*-armeabi-*' ! -name '*-arm64-*' ! -name '*-x86*' | head -n 1 || true)"
          fi
          if [ -z "$APK" ] || [ ! -f "$APK" ]; then
            echo "APK not found in $RELEASE_DIR"
            exit 1
          fi

          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
          echo "Using APK: $APK"
          echo "Using build-tools: $BUILD_TOOLS"

          if [ "$SIGNING" = signed ]; then
            "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
            CERTS="$("$BUILD_TOOLS/apksigner" verify --print-certs "$APK")"
            if echo "$CERTS" | grep -qi "CN=Android Debug"; then
              echo "ERROR: APK is signed with the Android debug certificate. Intune/Play will reject this."
              exit 1
            fi
            BADGING="$("$BUILD_TOOLS/aapt" dump badging "$APK")"
            echo "$BADGING" | grep -E "package:|native-code:|application-debuggable" || true
            if echo "$BADGING" | grep -q "application-debuggable"; then
              echo "ERROR: APK is marked debuggable."
              exit 1
            fi
            if [ "$TARGET_ENV" = prod ] && echo "$BADGING" | grep -qE "^split[ =]"; then
              echo "ERROR: APK is a config split, not a fat APK. This would cause INSTALL_FAILED_MISSING_SPLIT."
              exit 1
            fi
          fi

          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK as GitHub artifact
        if: ${{ steps.plan.outputs.do_apk == 'true' }}
        uses: actions/upload-artifact@v5
        with:
          name: ${{ steps.plan.outputs.artifact_apk }}
          path: ${{ steps.apk.outputs.apk_path }}

      - name: Distribute APK to Firebase App Distribution
        if: ${{ steps.plan.outputs.do_firebase == 'true' }}
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ env.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          groups: testers
          file: ${{ steps.apk.outputs.apk_path }}
          releaseNotes: |
            stoptb-meta: env=${{ inputs.environment }} signing=${{ inputs.signing }} package=${{ steps.plan.outputs.package_id }} versionName=${{ inputs.versionName }} versionCode=${{ inputs.versionCode }}
            Environment: ${{ steps.plan.outputs.firebase_label }}
            Signing: ${{ inputs.signing }}
            Version: ${{ inputs.versionName }} (${{ inputs.versionCode }})
            Branch: ${{ inputs.branch }}
            Package: ${{ steps.plan.outputs.package_id }}
            Description: ${{ inputs.description }}

      - name: Resolve Azure authentication mode
        if: ${{ steps.plan.outputs.do_intune == 'true' }}
        id: azure_auth
        run: |
          if [ -n "${AZURE_CLIENT_SECRET:-}" ]; then
            echo "auth_mode=secret" >> "$GITHUB_OUTPUT"
          else
            echo "auth_mode=oidc" >> "$GITHUB_OUTPUT"
          fi

      - name: Azure login (OIDC)
        if: ${{ steps.plan.outputs.do_intune == 'true' && steps.azure_auth.outputs.auth_mode == 'oidc' }}
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Get Microsoft Graph token
        if: ${{ steps.plan.outputs.do_intune == 'true' && steps.azure_auth.outputs.auth_mode == 'oidc' }}
        run: |
          TOKEN="$(az account get-access-token --resource https://graph.microsoft.com --query accessToken -o tsv)"
          echo "::add-mask::${TOKEN}"
          echo "GRAPH_TOKEN=${TOKEN}" >> "$GITHUB_ENV"

      - name: Upload signed APK to Intune MDM
        if: ${{ steps.plan.outputs.do_intune == 'true' }}
        run: |
          set -euo pipefail
          python3 -m pip install --quiet cryptography
          EXTRA_ARGS=()
          if [ -n "${INTUNE_APP_ID:-}" ]; then
            EXTRA_ARGS+=(--app-id "${INTUNE_APP_ID}")
          fi
          python3 "$RUNNER_TEMP/upload_intune_android_lob.py" \
            --apk "${{ steps.apk.outputs.apk_path }}" \
            --package-id "${{ steps.plan.outputs.package_id }}" \
            --version-name "${{ inputs.versionName }}" \
            --version-code "${{ inputs.versionCode }}" \
            --group-id "${INTUNE_GROUP_ID}" \
            --display-name "${{ steps.plan.outputs.intune_display_name }}" \
            --publisher "Piramal Swasthya" \
            --description "${{ steps.plan.outputs.firebase_label }} signed build updated to ${{ inputs.versionName }} (${{ inputs.versionCode }})" \
            "${EXTRA_ARGS[@]+"${EXTRA_ARGS[@]}"}"

      - name: Build PROD Release AAB
        if: ${{ steps.plan.outputs.do_play == 'true' }}
        run: ./gradlew ${{ steps.plan.outputs.gradle_aab_task }} --no-daemon --stacktrace

      - name: Find and prepare AAB
        if: ${{ steps.plan.outputs.do_play == 'true' }}
        id: aab
        run: |
          set -euo pipefail
          AAB_FILE="$(find app/build/outputs/bundle -type f -name '*.aab' | head -n 1 || true)"
          if [ -z "$AAB_FILE" ] || [ ! -f "$AAB_FILE" ]; then
            echo "ERROR: AAB file not found"
            find app/build/outputs/bundle -type f || true
            exit 1
          fi
          echo "AAB found at: $AAB_FILE"
          cp "$AAB_FILE" app-stoptb-release.aab
          echo "aab_path=app-stoptb-release.aab" >> "$GITHUB_OUTPUT"
          MAPPING_FILE="app/build/outputs/mapping/stoptbRelease/mapping.txt"
          if [ -f "$MAPPING_FILE" ]; then
            echo "mapping_file=$MAPPING_FILE" >> "$GITHUB_OUTPUT"
          else
            echo "WARNING: mapping.txt not found at $MAPPING_FILE"
            find app/build/outputs/mapping -type f || true
          fi

      - name: Upload AAB as GitHub artifact
        if: ${{ steps.plan.outputs.do_play == 'true' }}
        uses: actions/upload-artifact@v5
        with:
          name: prod-release-aab
          path: app-stoptb-release.aab

      - name: Upload AAB to Google Play Internal Testing
        if: ${{ steps.plan.outputs.do_play == 'true' && steps.aab.outputs.mapping_file != '' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: org.piramalswasthya.stoptb
          releaseFiles: app-stoptb-release.aab
          tracks: internal
          status: completed
          mappingFile: ${{ steps.aab.outputs.mapping_file }}

      - name: Upload AAB to Google Play Internal Testing
        if: ${{ steps.plan.outputs.do_play == 'true' && steps.aab.outputs.mapping_file == '' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: org.piramalswasthya.stoptb
          releaseFiles: app-stoptb-release.aab
          tracks: internal
          status: completed
