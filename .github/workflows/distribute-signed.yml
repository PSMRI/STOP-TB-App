name: StopTB MDM Signed Build (UAT or PROD)
run-name: STOP TB ${{ inputs.environment }} signed - ${{ inputs.versionName }} (${{ inputs.versionCode }}) [${{ inputs.branch }}]

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        default: uat
        options:
          - uat
          - prod
      description:
        description: 'Release notes / description for this build'
        required: false
        type: string
        default: ''
      branch:
        description: 'Git branch to build from. Matching is case-insensitive.'
        required: true
        type: string
        default: 'release-2.3'
      versionName:
        description: 'Build version (example: 1.0.3)'
        required: true
        type: string
        default: '1.0.3'
      versionCode:
        description: 'Build number (example: 4). For Play, must be higher than the last uploaded version code.'
        required: true
        type: string
        default: '4'

permissions:
  contents: read
  id-token: write

concurrency:
  group: distribute-signed-${{ inputs.environment }}-${{ inputs.branch }}
  cancel-in-progress: true

jobs:
  build-and-distribute:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Resolve environment config
        id: envcfg
        env:
          TARGET_ENV: ${{ inputs.environment }}
          ENCRYPTED_PASS_KEY: ${{ secrets.ENCRYPTED_PASS_KEY }}
          ENCRYPTED_PASS_KEY_UAT: ${{ secrets.ENCRYPTED_PASS_KEY_UAT }}
          ENCRYPTED_PASS_KEY_PROD: ${{ secrets.ENCRYPTED_PASS_KEY_PROD }}
          ABHA_CLIENT_SECRET: ${{ secrets.ABHA_CLIENT_SECRET }}
          ABHA_CLIENT_SECRET_UAT: ${{ secrets.ABHA_CLIENT_SECRET_UAT }}
          ABHA_CLIENT_SECRET_PROD: ${{ secrets.ABHA_CLIENT_SECRET_PROD }}
          ABHA_CLIENT_ID: ${{ secrets.ABHA_CLIENT_ID }}
          ABHA_CLIENT_ID_UAT: ${{ secrets.ABHA_CLIENT_ID_UAT }}
          ABHA_CLIENT_ID_PROD: ${{ secrets.ABHA_CLIENT_ID_PROD }}
          BASE_TMC_URL: ${{ secrets.BASE_TMC_URL }}
          BASE_TMC_URL_UAT: ${{ secrets.BASE_TMC_URL_UAT }}
          BASE_TMC_URL_PROD: ${{ secrets.BASE_TMC_URL_PROD }}
          BASE_ABHA_URL: ${{ secrets.BASE_ABHA_URL }}
          BASE_ABHA_URL_UAT: ${{ secrets.BASE_ABHA_URL_UAT }}
          BASE_ABHA_URL_PROD: ${{ secrets.BASE_ABHA_URL_PROD }}
          ABHA_TOKEN_URL: ${{ secrets.ABHA_TOKEN_URL }}
          ABHA_TOKEN_URL_UAT: ${{ secrets.ABHA_TOKEN_URL_UAT }}
          ABHA_TOKEN_URL_PROD: ${{ secrets.ABHA_TOKEN_URL_PROD }}
          ABHA_AUTH_URL: ${{ secrets.ABHA_AUTH_URL }}
          ABHA_AUTH_URL_UAT: ${{ secrets.ABHA_AUTH_URL_UAT }}
          ABHA_AUTH_URL_PROD: ${{ secrets.ABHA_AUTH_URL_PROD }}
          CHAT_URL: ${{ secrets.CHAT_URL }}
          CHAT_URL_UAT: ${{ secrets.CHAT_URL_UAT }}
          CHAT_URL_PROD: ${{ secrets.CHAT_URL_PROD }}
          FIREBASE_APP_ID_UAT: ${{ secrets.FIREBASE_APP_ID_UAT }}
          FIREBASE_APP_ID_PROD: ${{ secrets.FIREBASE_APP_ID_PROD }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_ID_UAT: ${{ secrets.AZURE_CLIENT_ID_UAT }}
          AZURE_CLIENT_ID_PROD: ${{ secrets.AZURE_CLIENT_ID_PROD }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_TENANT_ID_UAT: ${{ secrets.AZURE_TENANT_ID_UAT }}
          AZURE_TENANT_ID_PROD: ${{ secrets.AZURE_TENANT_ID_PROD }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_CLIENT_SECRET_UAT: ${{ secrets.AZURE_CLIENT_SECRET_UAT }}
          AZURE_CLIENT_SECRET_PROD: ${{ secrets.AZURE_CLIENT_SECRET_PROD }}
          INTUNE_GROUP_ID: ${{ secrets.INTUNE_GROUP_ID }}
          INTUNE_GROUP_ID_UAT: ${{ secrets.INTUNE_GROUP_ID_UAT }}
          INTUNE_GROUP_ID_PROD: ${{ secrets.INTUNE_GROUP_ID_PROD }}
          INTUNE_APP_ID: ${{ secrets.INTUNE_APP_ID }}
          INTUNE_APP_ID_UAT: ${{ secrets.INTUNE_APP_ID_UAT }}
          INTUNE_APP_ID_PROD: ${{ secrets.INTUNE_APP_ID_PROD }}
        run: |
          set -euo pipefail
          pick() {
            if [ -n "${1:-}" ]; then
              printf '%s' "$1"
            else
              printf '%s' "${2:-}"
            fi
          }

          if [ "$TARGET_ENV" = prod ]; then
            {
              echo "gradle_apk_task=assembleStoptbRelease"
              echo "gradle_aab_task=bundleStoptbRelease"
              echo "package_id=org.piramalswasthya.stoptb"
              echo "apk_dir=app/build/outputs/apk/stoptb/release"
              echo "apk_name=app-stoptb"
              echo "artifact_apk=prod-release-apk"
              echo "do_intune=true"
              echo "do_play=true"
              echo "firebase_label=PROD"
            } >> "$GITHUB_OUTPUT"
            {
              echo "ENCRYPTED_PASS_KEY=$(pick "${ENCRYPTED_PASS_KEY_PROD:-}" "${ENCRYPTED_PASS_KEY:-}")"
              echo "ABHA_CLIENT_SECRET=$(pick "${ABHA_CLIENT_SECRET_PROD:-}" "${ABHA_CLIENT_SECRET:-}")"
              echo "ABHA_CLIENT_ID=$(pick "${ABHA_CLIENT_ID_PROD:-}" "${ABHA_CLIENT_ID:-}")"
              echo "BASE_TMC_URL=$(pick "${BASE_TMC_URL_PROD:-}" "${BASE_TMC_URL:-}")"
              echo "BASE_ABHA_URL=$(pick "${BASE_ABHA_URL_PROD:-}" "${BASE_ABHA_URL:-}")"
              echo "ABHA_TOKEN_URL=$(pick "${ABHA_TOKEN_URL_PROD:-}" "${ABHA_TOKEN_URL:-}")"
              echo "ABHA_AUTH_URL=$(pick "${ABHA_AUTH_URL_PROD:-}" "${ABHA_AUTH_URL:-}")"
              echo "CHAT_URL=$(pick "${CHAT_URL_PROD:-}" "${CHAT_URL:-}")"
              echo "FIREBASE_APP_ID=${FIREBASE_APP_ID_PROD:-}"
              echo "AZURE_CLIENT_ID=$(pick "${AZURE_CLIENT_ID_PROD:-}" "${AZURE_CLIENT_ID:-}")"
              echo "AZURE_TENANT_ID=$(pick "${AZURE_TENANT_ID_PROD:-}" "${AZURE_TENANT_ID:-}")"
              echo "AZURE_CLIENT_SECRET=$(pick "${AZURE_CLIENT_SECRET_PROD:-}" "${AZURE_CLIENT_SECRET:-}")"
              echo "INTUNE_GROUP_ID=$(pick "${INTUNE_GROUP_ID_PROD:-}" "${INTUNE_GROUP_ID:-}")"
              echo "INTUNE_APP_ID=$(pick "${INTUNE_APP_ID_PROD:-}" "${INTUNE_APP_ID:-}")"
            } >> "$GITHUB_ENV"
          else
            {
              echo "gradle_apk_task=assembleStoptbUatRelease"
              echo "gradle_aab_task="
              echo "package_id=org.piramalswasthya.stoptb.uat"
              echo "apk_dir=app/build/outputs/apk/stoptbUat/release"
              echo "apk_name=app-stoptbUat"
              echo "artifact_apk=uat-release-apk"
              echo "do_intune=true"
              echo "do_play=false"
              echo "firebase_label=UAT"
            } >> "$GITHUB_OUTPUT"
            {
              echo "ENCRYPTED_PASS_KEY=$(pick "${ENCRYPTED_PASS_KEY_UAT:-}" "${ENCRYPTED_PASS_KEY:-}")"
              echo "ABHA_CLIENT_SECRET=$(pick "${ABHA_CLIENT_SECRET_UAT:-}" "${ABHA_CLIENT_SECRET:-}")"
              echo "ABHA_CLIENT_ID=$(pick "${ABHA_CLIENT_ID_UAT:-}" "${ABHA_CLIENT_ID:-}")"
              echo "BASE_TMC_URL=$(pick "${BASE_TMC_URL_UAT:-}" "${BASE_TMC_URL:-}")"
              echo "BASE_ABHA_URL=$(pick "${BASE_ABHA_URL_UAT:-}" "${BASE_ABHA_URL:-}")"
              echo "ABHA_TOKEN_URL=$(pick "${ABHA_TOKEN_URL_UAT:-}" "${ABHA_TOKEN_URL:-}")"
              echo "ABHA_AUTH_URL=$(pick "${ABHA_AUTH_URL_UAT:-}" "${ABHA_AUTH_URL:-}")"
              echo "CHAT_URL=$(pick "${CHAT_URL_UAT:-}" "${CHAT_URL:-}")"
              echo "FIREBASE_APP_ID=${FIREBASE_APP_ID_UAT:-}"
              echo "AZURE_CLIENT_ID=$(pick "${AZURE_CLIENT_ID_UAT:-}" "${AZURE_CLIENT_ID:-}")"
              echo "AZURE_TENANT_ID=$(pick "${AZURE_TENANT_ID_UAT:-}" "${AZURE_TENANT_ID:-}")"
              echo "AZURE_CLIENT_SECRET=$(pick "${AZURE_CLIENT_SECRET_UAT:-}" "${AZURE_CLIENT_SECRET:-}")"
              echo "INTUNE_GROUP_ID=$(pick "${INTUNE_GROUP_ID_UAT:-}" "${INTUNE_GROUP_ID:-}")"
              echo "INTUNE_APP_ID=$(pick "${INTUNE_APP_ID_UAT:-}" "${INTUNE_APP_ID:-}")"
            } >> "$GITHUB_ENV"
          fi
          echo "Selected environment: $TARGET_ENV"

      - name: Check required secrets
        env:
          TARGET_ENV: ${{ inputs.environment }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SERVICES_JSON_UAT: ${{ secrets.GOOGLE_SERVICES_JSON_UAT }}
          GOOGLE_SERVICES_JSON_PROD: ${{ secrets.GOOGLE_SERVICES_JSON_PROD }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          missing=0
          for name in RELEASE_KEYSTORE_BASE64 RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD FIREBASE_SERVICE_ACCOUNT_JSON GOOGLE_SERVICES_JSON_UAT GOOGLE_SERVICES_JSON_PROD FIREBASE_APP_ID ENCRYPTED_PASS_KEY ABHA_CLIENT_ID ABHA_CLIENT_SECRET BASE_TMC_URL AZURE_CLIENT_ID AZURE_TENANT_ID INTUNE_GROUP_ID; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required secret/value for $TARGET_ENV: $name"
              missing=1
            fi
          done
          if [ "$TARGET_ENV" = prod ] && [ -z "${GOOGLE_PLAY_SERVICE_ACCOUNT_JSON:-}" ]; then
            echo "Missing required secret for PROD Play upload: GOOGLE_PLAY_SERVICE_ACCOUNT_JSON"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "Add the missing repository secrets, then re-run this workflow."
            echo "UAT uses *_UAT secrets (or unsuffixed fallback). PROD uses *_PROD secrets (or unsuffixed fallback)."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Preserve Intune upload script
        if: ${{ steps.envcfg.outputs.do_intune == 'true' }}
        run: cp .github/scripts/upload_intune_android_lob.py "$RUNNER_TEMP/upload_intune_android_lob.py"

      - name: Checkout requested branch
        run: |
          set -euo pipefail
          REQUESTED="${{ inputs.branch }}"
          MATCH="$(git ls-remote --heads origin | awk '{print $2}' | sed 's|^refs/heads/||' | grep -ixF -- "$REQUESTED" | head -n 1 || true)"
          if [ -z "$MATCH" ]; then
            echo "Branch not found: '$REQUESTED'"
            echo "Available branches:"
            git ls-remote --heads origin | awk '{print $2}' | sed 's|^refs/heads/||'
            exit 1
          fi
          if [ "$MATCH" != "$REQUESTED" ]; then
            echo "Using existing branch '$MATCH' for requested '$REQUESTED'"
          fi
          git fetch --no-tags --depth=1 origin "$MATCH"
          git checkout --force -B "$MATCH" FETCH_HEAD
          echo "Checked out $MATCH @ $(git rev-parse --short HEAD)"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Create google-services.json
        env:
          GOOGLE_SERVICES_JSON_UAT: ${{ secrets.GOOGLE_SERVICES_JSON_UAT }}
          GOOGLE_SERVICES_JSON_PROD: ${{ secrets.GOOGLE_SERVICES_JSON_PROD }}
        run: |
          set -euo pipefail
          mkdir -p app/src/stoptbUat app/src/stoptb
          printf '%s\n' "$GOOGLE_SERVICES_JSON_UAT" > app/src/stoptbUat/google-services.json
          printf '%s\n' "$GOOGLE_SERVICES_JSON_PROD" > app/src/stoptb/google-services.json

      - name: Accept SDK licenses
        run: yes 2>/dev/null | sdkmanager --licenses >/dev/null || true

      - name: Install NDK
        run: sdkmanager "ndk;29.0.14033849"

      - name: Set app version
        env:
          VERSION_NAME: ${{ inputs.versionName }}
          VERSION_CODE: ${{ inputs.versionCode }}
        run: |
          set -euo pipefail
          if [ -z "${VERSION_CODE}" ] || ! [[ "${VERSION_CODE}" =~ ^[1-9][0-9]*$ ]]; then
            echo "versionCode must be a positive integer (got: '${VERSION_CODE}')."
            exit 1
          fi
          printf 'VERSION=%s\nVERSIONCODE=%s\n' "${VERSION_NAME}" "${VERSION_CODE}" > version/version.properties
          echo "Using app version:"
          cat version/version.properties

      - name: Create release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$GITHUB_WORKSPACE/stoptb_signing_key.jks"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          python3 <<'PY'
          import os
          from pathlib import Path
          workspace = Path(os.environ["GITHUB_WORKSPACE"])
          store_file = workspace / "stoptb_signing_key.jks"
          (workspace / "keystore.properties").write_text(
              "storeFile={}\nstorePassword={}\nkeyAlias={}\nkeyPassword={}\n".format(
                  store_file,
                  os.environ["RELEASE_STORE_PASSWORD"],
                  os.environ["RELEASE_KEY_ALIAS"],
                  os.environ["RELEASE_KEY_PASSWORD"],
              )
          )
          PY

      - name: Build signed APK
        run: ./gradlew ${{ steps.envcfg.outputs.gradle_apk_task }} --no-daemon --stacktrace

      - name: Verify signed APK
        id: apk
        run: |
          set -euo pipefail
          RELEASE_DIR="${{ steps.envcfg.outputs.apk_dir }}"
          NAME="${{ steps.envcfg.outputs.apk_name }}"
          echo "Release APKs:"
          ls -la "$RELEASE_DIR"

          APK="$RELEASE_DIR/${NAME}-release.apk"
          if [ ! -f "$APK" ]; then
            APK="$RELEASE_DIR/${NAME}-universal-release.apk"
          fi
          if [ ! -f "$APK" ]; then
            APK="$(find "$RELEASE_DIR" -name '*release*.apk' ! -name '*-armeabi-*' ! -name '*-arm64-*' ! -name '*-x86*' | head -n 1 || true)"
          fi
          if [ -z "$APK" ] || [ ! -f "$APK" ]; then
            echo "Release APK not found in $RELEASE_DIR"
            exit 1
          fi

          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          CERTS="$("$BUILD_TOOLS/apksigner" verify --print-certs "$APK")"
          if echo "$CERTS" | grep -qi "CN=Android Debug"; then
            echo "ERROR: APK is signed with the Android debug certificate."
            exit 1
          fi
          BADGING="$("$BUILD_TOOLS/aapt" dump badging "$APK")"
          echo "$BADGING" | grep -E "package:|application-debuggable" || true
          if echo "$BADGING" | grep -q "application-debuggable"; then
            echo "ERROR: APK is marked debuggable."
            exit 1
          fi
          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK as GitHub artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ steps.envcfg.outputs.artifact_apk }}
          path: ${{ steps.apk.outputs.apk_path }}

      - name: Distribute APK to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ env.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          groups: testers
          file: ${{ steps.apk.outputs.apk_path }}
          releaseNotes: |
            Environment: ${{ steps.envcfg.outputs.firebase_label }}
            Version: ${{ inputs.versionName }} (${{ inputs.versionCode }})
            Branch: ${{ inputs.branch }}
            Package: ${{ steps.envcfg.outputs.package_id }}
            Description: ${{ inputs.description }}

      - name: Resolve Azure authentication mode
        if: ${{ steps.envcfg.outputs.do_intune == 'true' }}
        id: azure_auth
        run: |
          if [ -n "${AZURE_CLIENT_SECRET:-}" ]; then
            echo "auth_mode=secret" >> "$GITHUB_OUTPUT"
          else
            echo "auth_mode=oidc" >> "$GITHUB_OUTPUT"
          fi

      - name: Azure login (OIDC)
        if: ${{ steps.envcfg.outputs.do_intune == 'true' && steps.azure_auth.outputs.auth_mode == 'oidc' }}
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Get Microsoft Graph token
        if: ${{ steps.envcfg.outputs.do_intune == 'true' && steps.azure_auth.outputs.auth_mode == 'oidc' }}
        run: |
          TOKEN="$(az account get-access-token --resource https://graph.microsoft.com --query accessToken -o tsv)"
          echo "::add-mask::${TOKEN}"
          echo "GRAPH_TOKEN=${TOKEN}" >> "$GITHUB_ENV"

      - name: Upload signed APK to Intune MDM
        if: ${{ steps.envcfg.outputs.do_intune == 'true' }}
        run: |
          set -euo pipefail
          python3 -m pip install --quiet cryptography
          EXTRA_ARGS=()
          if [ -n "${INTUNE_APP_ID:-}" ]; then
            EXTRA_ARGS+=(--app-id "${INTUNE_APP_ID}")
          fi
          python3 "$RUNNER_TEMP/upload_intune_android_lob.py" \
            --apk "${{ steps.apk.outputs.apk_path }}" \
            --package-id "${{ steps.envcfg.outputs.package_id }}" \
            --version-name "${{ inputs.versionName }}" \
            --version-code "${{ inputs.versionCode }}" \
            --group-id "${INTUNE_GROUP_ID}" \
            --display-name "StopTB ${{ steps.envcfg.outputs.firebase_label }}" \
            --publisher "Piramal Swasthya" \
            --description "${{ steps.envcfg.outputs.firebase_label }} signed build ${{ inputs.versionName }} (${{ inputs.versionCode }})" \
            "${EXTRA_ARGS[@]+"${EXTRA_ARGS[@]}"}"

      - name: Build PROD Release AAB
        if: ${{ steps.envcfg.outputs.do_play == 'true' }}
        run: ./gradlew ${{ steps.envcfg.outputs.gradle_aab_task }} --no-daemon --stacktrace

      - name: Find and prepare AAB
        if: ${{ steps.envcfg.outputs.do_play == 'true' }}
        id: aab
        run: |
          set -euo pipefail
          AAB_FILE="$(find app/build/outputs/bundle -type f -name '*.aab' | head -n 1 || true)"
          if [ -z "$AAB_FILE" ] || [ ! -f "$AAB_FILE" ]; then
            echo "ERROR: AAB file not found"
            exit 1
          fi
          cp "$AAB_FILE" app-stoptb-release.aab
          echo "aab_path=app-stoptb-release.aab" >> "$GITHUB_OUTPUT"
          MAPPING_FILE="app/build/outputs/mapping/stoptbRelease/mapping.txt"
          if [ -f "$MAPPING_FILE" ]; then
            echo "mapping_file=$MAPPING_FILE" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload AAB as GitHub artifact
        if: ${{ steps.envcfg.outputs.do_play == 'true' }}
        uses: actions/upload-artifact@v5
        with:
          name: prod-release-aab
          path: app-stoptb-release.aab

      - name: Upload AAB to Google Play Internal Testing
        if: ${{ steps.envcfg.outputs.do_play == 'true' && steps.aab.outputs.mapping_file != '' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: org.piramalswasthya.stoptb
          releaseFiles: app-stoptb-release.aab
          tracks: internal
          status: completed
          mappingFile: ${{ steps.aab.outputs.mapping_file }}

      - name: Upload AAB to Google Play Internal Testing
        if: ${{ steps.envcfg.outputs.do_play == 'true' && steps.aab.outputs.mapping_file == '' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: org.piramalswasthya.stoptb
          releaseFiles: app-stoptb-release.aab
          tracks: internal
          status: completed
